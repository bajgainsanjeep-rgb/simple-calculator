<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1>


    <div class="main">
        <div class="amount">
            <input id="input" type="text" readonly>
        </div>
        <div class="numbers">
            <button id="digit">1</button>
            <button id="digit">2</button>
            <button id="digit">3</button>
            <button id="digit">4</button>
            <button id="digit">5</button>
            <button id="digit">6</button>
            <button id="digit">7</button>
            <button id="digit">8</button>
            <button id="digit">9</button>
            <button id="digit">0</button>
             <button id="digit">=</button>
             <button id="digit">*</button>
             <button id="digit">/</button>
             <button id="digit">-</button>
             <button id="digit">+</button>
             
             <button id="digit">AC</button>
        </div>
    </div>


<script src="script.js"></script>
</body>
</html>
